<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vosk ASR Tester</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;700;800&display=swap');

  :root {
    --bg: #0a0c0f;
    --surface: #111418;
    --border: #1e2530;
    --accent: #00e5a0;
    --accent2: #0099ff;
    --warn: #ff6b35;
    --text: #e8edf2;
    --muted: #5a6478;
    --success: #00e5a0;
    --error: #ff4757;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    padding: 2rem;
  }

  /* Subtle grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,229,160,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,160,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    margin-bottom: 2.5rem;
  }

  h1 {
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -0.03em;
  }

  h1 span { color: var(--accent); }

  .version-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    background: var(--border);
    color: var(--muted);
    padding: 2px 8px;
    border-radius: 4px;
    letter-spacing: 0.05em;
  }

  .grid {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 1.5rem;
    max-width: 1200px;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
  }

  .panel-title {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1.2rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .panel-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .field { margin-bottom: 1rem; }

  label {
    display: block;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.4rem;
  }

  input, select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    padding: 0.6rem 0.8rem;
    outline: none;
    transition: border-color 0.15s;
  }

  input:focus, select:focus { border-color: var(--accent); }

  .btn {
    width: 100%;
    padding: 0.75rem;
    border-radius: 8px;
    border: none;
    font-family: 'Syne', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: all 0.15s;
    margin-bottom: 0.6rem;
  }

  .btn-connect {
    background: var(--accent);
    color: #000;
  }
  .btn-connect:hover { filter: brightness(1.1); }
  .btn-connect:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-disconnect {
    background: transparent;
    border: 1px solid var(--error);
    color: var(--error);
  }
  .btn-disconnect:hover { background: rgba(255,71,87,0.1); }
  .btn-disconnect:disabled { opacity: 0.3; cursor: not-allowed; }

  .btn-send {
    background: var(--accent2);
    color: #fff;
  }
  .btn-send:hover { filter: brightness(1.1); }
  .btn-send:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-mic {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
  }
  .btn-mic:hover { background: rgba(0,229,160,0.08); }
  .btn-mic.recording {
    background: rgba(255,71,87,0.15);
    border-color: var(--error);
    color: var(--error);
    animation: pulse-border 1s ease-in-out infinite;
  }
  .btn-mic:disabled { opacity: 0.4; cursor: not-allowed; }

  @keyframes pulse-border {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,71,87,0.4); }
    50% { box-shadow: 0 0 0 6px rgba(255,71,87,0); }
  }

  .status-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    padding: 0.5rem 0.75rem;
    border-radius: 6px;
    background: var(--bg);
    border: 1px solid var(--border);
    margin-bottom: 1rem;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  .dot.connected { background: var(--success); box-shadow: 0 0 6px var(--success); }
  .dot.connecting { background: var(--warn); animation: blink 0.6s infinite; }
  .dot.error { background: var(--error); }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    padding: 0.7rem;
    resize: vertical;
    outline: none;
    transition: border-color 0.15s;
    line-height: 1.5;
  }
  textarea:focus { border-color: var(--accent2); }

  /* Log panel */
  .log-panel {
    grid-column: 1 / -1;
  }

  #log {
    height: 320px;
    overflow-y: auto;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    line-height: 1.7;
  }

  #log::-webkit-scrollbar { width: 4px; }
  #log::-webkit-scrollbar-track { background: transparent; }
  #log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .log-entry { display: flex; gap: 0.75rem; }
  .log-time { color: var(--muted); flex-shrink: 0; }
  .log-sent { color: var(--accent2); }
  .log-recv { color: var(--accent); }
  .log-info { color: var(--muted); }
  .log-error { color: var(--error); }
  .log-partial { color: var(--warn); }
  .log-final { color: var(--accent); font-weight: 700; }

  /* Transcript panel */
  #transcript-box {
    min-height: 120px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.9rem;
    line-height: 1.8;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .partial-text { color: var(--warn); opacity: 0.7; }
  .final-text { color: var(--text); }

  /* JSON result */
  #json-box {
    height: 160px;
    overflow-y: auto;
    resize: vertical;
  }

  .clear-btn {
    float: right;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 0.7rem;
    font-family: 'JetBrains Mono', monospace;
    cursor: pointer;
    letter-spacing: 0.05em;
    padding: 0 0 0.5rem 0;
  }
  .clear-btn:hover { color: var(--error); }

  .badge {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    padding: 2px 6px;
    border-radius: 3px;
    letter-spacing: 0.05em;
    font-weight: 700;
  }
  .badge-send { background: rgba(0,153,255,0.15); color: var(--accent2); border: 1px solid rgba(0,153,255,0.3); }
  .badge-recv { background: rgba(0,229,160,0.1); color: var(--accent); border: 1px solid rgba(0,229,160,0.2); }
  .badge-err  { background: rgba(255,71,87,0.1); color: var(--error); border: 1px solid rgba(255,71,87,0.2); }

  .divider { height: 1px; background: var(--border); margin: 1rem 0; }

  .stats-row {
    display: flex;
    gap: 1rem;
    margin-bottom: 1rem;
  }

  .stat {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.5rem 0.75rem;
    text-align: center;
  }

  .stat-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--accent);
  }

  .stat-lbl {
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 2px;
  }

  .audio-bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 0.5rem;
  }

  .audio-level {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    width: 0%;
    transition: width 0.05s;
  }
</style>
</head>
<body>

<header>
  <h1>Vosk <span>ASR</span> Tester</h1>
  <span class="version-tag">WebSocket Debug Tool</span>
</header>

<div class="grid">

  <!-- LEFT: Controls -->
  <div>
    <div class="panel">
      <div class="panel-title">Connection</div>

      <div class="status-row">
        <div class="dot" id="dot"></div>
        <span id="status-text">Disconnected</span>
      </div>

      <div class="field">
        <label>WebSocket URL</label>
        <input type="text" id="url" value="ws://127.0.0.1:2700" />
      </div>

      <button class="btn btn-connect" id="btn-connect" onclick="connect()">Connect</button>
      <button class="btn btn-disconnect" id="btn-disconnect" onclick="disconnect()" disabled>Disconnect</button>

      <div class="divider"></div>
      <div class="panel-title">Send JSON</div>

      <div class="field">
        <label>Raw JSON Message</label>
        <textarea id="json-input" rows="3">{"config": {"sample_rate": 16000}}</textarea>
      </div>
      <button class="btn btn-send" id="btn-send" onclick="sendJSON()" disabled>Send JSON</button>

      <div class="divider"></div>
      <div class="panel-title">Microphone</div>

      <div class="stats-row">
        <div class="stat">
          <div class="stat-val" id="stat-frames">0</div>
          <div class="stat-lbl">Frames Sent</div>
        </div>
        <div class="stat">
          <div class="stat-val" id="stat-results">0</div>
          <div class="stat-lbl">Results</div>
        </div>
      </div>

      <div class="audio-bar"><div class="audio-level" id="audio-level"></div></div>

      <button class="btn btn-mic" id="btn-mic" onclick="toggleMic()" disabled style="margin-top:0.75rem">
        <span id="mic-icon">🎤</span>
        <span id="mic-label">Start Recording</span>
      </button>

      <div class="field" style="margin-top:0.75rem">
        <label>Sample Rate</label>
        <select id="sample-rate">
          <option value="16000">16000 Hz (vosk asr native small model)</option>
          <option value="44100">44100 Hz</option>
          <option value="48000">48000 Hz</option>
        </select>
      </div>
    </div>
  </div>

  <!-- RIGHT: Results -->
  <div style="display:flex;flex-direction:column;gap:1.5rem">

    <div class="panel">
      <button class="clear-btn" onclick="clearTranscript()">clear</button>
      <div class="panel-title">Transcript</div>
      <div id="transcript-box"><span class="log-info">Waiting for speech...</span></div>
    </div>

    <div class="panel">
      <button class="clear-btn" onclick="clearJSON()">clear</button>
      <div class="panel-title">Raw JSON Responses</div>
      <textarea id="json-box" readonly></textarea>
    </div>

    <div class="panel log-panel">
      <button class="clear-btn" onclick="clearLog()">clear</button>
      <div class="panel-title">Protocol Log</div>
      <div id="log"></div>
    </div>

  </div>
</div>

<script>
let ws = null;
let mediaStream = null;
let audioContext = null;
let processor = null;
let analyser = null;
let recording = false;
let framesSent = 0;
let resultsCount = 0;
let transcriptFinal = '';
let animFrame = null;

// ── WebSocket ──────────────────────────────────────────────

function connect() {
  const url = document.getElementById('url').value.trim();
  if (!url) return;

  setStatus('connecting', 'Connecting...');
  log('info', `Connecting to ${url}`);

  try {
    ws = new WebSocket(url);
    ws.binaryType = 'arraybuffer';
  } catch(e) {
    setStatus('error', 'Invalid URL');
    log('error', `Invalid URL: ${e.message}`);
    return;
  }

  ws.onopen = () => {
    setStatus('connected', `Connected — ${url}`);
    log('info', 'WebSocket connection established');
    document.getElementById('btn-connect').disabled = true;
    document.getElementById('btn-disconnect').disabled = false;
    document.getElementById('btn-send').disabled = false;
    document.getElementById('btn-mic').disabled = false;

    // Send initial config matching FreeSWITCH codec
    const sampleRate = parseInt(document.getElementById('sample-rate').value);
    const config = JSON.stringify({ config: { sample_rate: sampleRate } });
    ws.send(config);
    log('sent', `Config → ${config}`);
  };

  ws.onmessage = (event) => {
    const msg = typeof event.data === 'string' ? event.data : '[binary]';
    log('recv', msg);

    // Append to raw JSON box
    const jbox = document.getElementById('json-box');
    jbox.value += msg + '\n';
    jbox.scrollTop = jbox.scrollHeight;

    resultsCount++;
    document.getElementById('stat-results').textContent = resultsCount;

    // Parse and update transcript
    try {
      const obj = JSON.parse(msg);
      if (obj.text !== undefined && obj.text !== '') {
        transcriptFinal += obj.text + ' ';
        updateTranscript('');
      } else if (obj.partial !== undefined) {
        updateTranscript(obj.partial);
      } else if (obj.result !== undefined) {
        // Final result with word timing
        transcriptFinal += (obj.text || '') + ' ';
        updateTranscript('');
      }
    } catch(e) { /* not JSON */ }
  };

  ws.onerror = (e) => {
    setStatus('error', 'Connection error');
    log('error', 'WebSocket error — check console');
  };

  ws.onclose = (e) => {
    setStatus('disconnected', `Closed (${e.code}: ${e.reason || 'no reason'})`);
    log('info', `Connection closed — code ${e.code}`);
    resetUI();
  };
}

function disconnect() {
  if (ws) ws.close();
  stopMic();
}

function sendJSON() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  const msg = document.getElementById('json-input').value.trim();
  if (!msg) return;
  ws.send(msg);
  log('sent', `JSON → ${msg}`);
}

// ── Microphone ────────────────────────────────────────────

async function toggleMic() {
  if (recording) { stopMic(); return; }

  try {
    const sampleRate = parseInt(document.getElementById('sample-rate').value);
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });

    audioContext = new AudioContext({ sampleRate });
    const source = audioContext.createMediaStreamSource(mediaStream);

    analyser = audioContext.createAnalyser();
    analyser.fftSize = 256;
    source.connect(analyser);

    // ScriptProcessor for raw PCM (works cross-browser)
    processor = audioContext.createScriptProcessor(4096, 1, 1);
    source.connect(processor);
    processor.connect(audioContext.destination);

    processor.onaudioprocess = (e) => {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;

      const float32 = e.inputBuffer.getChannelData(0);
      // Convert Float32 → Int16 PCM (what Vosk expects)
      const int16 = new Int16Array(float32.length);
      for (let i = 0; i < float32.length; i++) {
        const s = Math.max(-1, Math.min(1, float32[i]));
        int16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
      }

      ws.send(int16.buffer);
      framesSent++;
      document.getElementById('stat-frames').textContent = framesSent;
    };

    recording = true;
    startLevelMeter();

    document.getElementById('btn-mic').classList.add('recording');
    document.getElementById('mic-icon').textContent = '⏹';
    document.getElementById('mic-label').textContent = 'Stop Recording';
    log('info', `Microphone active — ${sampleRate}Hz PCM16`);

  } catch(e) {
    log('error', `Mic error: ${e.message}`);
  }
}

function stopMic() {
  if (processor) { processor.disconnect(); processor = null; }
  if (audioContext) { audioContext.close(); audioContext = null; }
  if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
  analyser = null;
  recording = false;

  if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
  document.getElementById('audio-level').style.width = '0%';
  document.getElementById('btn-mic').classList.remove('recording');
  document.getElementById('mic-icon').textContent = '🎤';
  document.getElementById('mic-label').textContent = 'Start Recording';

  // Send EOF to get final result
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send('{"eof": 1}');
    log('sent', 'EOF → {"eof": 1}');
  }
}

function startLevelMeter() {
  const buf = new Uint8Array(analyser ? analyser.frequencyBinCount : 128);
  function tick() {
    if (!analyser) return;
    analyser.getByteFrequencyData(buf);
    const avg = buf.reduce((a,b)=>a+b,0) / buf.length;
    document.getElementById('audio-level').style.width = Math.min(100, avg * 2) + '%';
    animFrame = requestAnimationFrame(tick);
  }
  tick();
}

// ── UI helpers ────────────────────────────────────────────

function setStatus(state, text) {
  const dot = document.getElementById('dot');
  const st = document.getElementById('status-text');
  dot.className = 'dot ' + (state === 'connected' ? 'connected' : state === 'connecting' ? 'connecting' : state === 'error' ? 'error' : '');
  st.textContent = text;
}

function resetUI() {
  document.getElementById('btn-connect').disabled = false;
  document.getElementById('btn-disconnect').disabled = true;
  document.getElementById('btn-send').disabled = true;
  document.getElementById('btn-mic').disabled = true;
  stopMic();
}

function updateTranscript(partial) {
  const box = document.getElementById('transcript-box');
  box.innerHTML =
    (transcriptFinal ? `<span class="final-text">${escHTML(transcriptFinal)}</span>` : '') +
    (partial ? `<span class="partial-text">${escHTML(partial)}...</span>` : '');
  if (!transcriptFinal && !partial) {
    box.innerHTML = '<span class="log-info">Waiting for speech...</span>';
  }
}

function clearTranscript() {
  transcriptFinal = '';
  updateTranscript('');
}

function clearJSON() { document.getElementById('json-box').value = ''; }
function clearLog() { document.getElementById('log').innerHTML = ''; }

function log(type, msg) {
  const el = document.getElementById('log');
  const time = new Date().toLocaleTimeString('en-GB', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit', fractionalSecondDigits: 2 });

  let badge = '';
  let cls = 'log-info';
  if (type === 'sent') { badge = '<span class="badge badge-send">SEND</span> '; cls = 'log-sent'; }
  else if (type === 'recv') {
    badge = '<span class="badge badge-recv">RECV</span> ';
    cls = msg.includes('"partial"') ? 'log-partial' : msg.includes('"text"') ? 'log-final' : 'log-recv';
  }
  else if (type === 'error') { badge = '<span class="badge badge-err">ERR</span> '; cls = 'log-error'; }

  const row = document.createElement('div');
  row.className = 'log-entry';
  row.innerHTML = `<span class="log-time">${time}</span><span class="${cls}">${badge}${escHTML(msg)}</span>`;
  el.appendChild(row);
  el.scrollTop = el.scrollHeight;

  // Keep max 200 entries
  while (el.children.length > 200) el.removeChild(el.firstChild);
}

function escHTML(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Init ──────────────────────────────────────────────────
log('info', 'Vosk ASR Tester ready — enter WebSocket URL and click Connect');
log('info', 'For FreeSWITCH mod_vosk testing: ws://127.0.0.1:2700');
</script>
</body>
</html>
