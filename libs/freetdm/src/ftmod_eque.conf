; eque.conf — optional configuration for the mod_eque bare-bearer signaling stub.
;
; This file is loaded by the FreeTDM core only if mod_eque has an io_load
; entry-point that calls fio->configure().  The eque module is signaling-only
; and carries no I/O interface, so this file is informational/reserved for
; future use.  Per-span parameters (reconnect-delay-ms etc.) belong in
; freetdm.conf.xml inside the <param> elements of the relevant span block.
;
; Example freetdm.conf.xml span entry
; ─────────────────────────────────────
; <span name="t1-bearer-1">
;   <param name="signaling"          value="eque"/>
;   <param name="reconnect-delay-ms" value="2000"/>
; </span>
;
; Parameters
; ──────────
; reconnect-delay-ms  (default: 2000)
;   Number of milliseconds to wait after a channel falls to the DOWN state
;   before it is re-offered to FreeSWITCH as a new inbound call.  Set this
;   to match the tail-end guard time of the application consuming the bearer.
;
[general]
; (no options currently used at module-load time)
